name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: securesphere_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Static security analysis
        run: uv run bandit -q -r app -c pyproject.toml
      - name: Dependency vulnerability audit
        run: uv run pip-audit
      - name: Tests (SQLite)
        run: uv run pytest
      - name: Tests (PostgreSQL)
        env:
          SS_TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/securesphere_test
        run: uv run pytest
      - name: Migrations on a clean PostgreSQL database
        env:
          SS_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/securesphere_test
        run: |
          uv run python -c "from sqlalchemy import create_engine, text; e=create_engine('$SS_DATABASE_URL'); c=e.connect(); c.execute(text('DROP SCHEMA public CASCADE; CREATE SCHEMA public')); c.commit()"
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t securesphere-backend ./backend
      - run: docker build -t securesphere-frontend ./frontend
